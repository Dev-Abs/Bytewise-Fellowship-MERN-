<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* put button in center of screen */
        #checkout-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        /* cool animation by slightly moving the button with color combination changes */
        #checkout-button:hover {
            background-color: #45a049;
            transition: 0.3s;
            transform: translate(-50%, -50%) scale(1.1);
        }
        

    </style>
    <title>Grocery - Items</title>
</head>
<body>
    <!-- checkout button -->
    <button id="checkout-button">Checkout</button>

    <script src="script.js"></script>
</body>
</html>
